<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Workspace - Horario de Estudio</title>
  <style>
    /* Estilos generales (Tema Oscuro) */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      min-height: 100vh;
    }

    /* Barra lateral */
    .sidebar {
      width: 250px;
      background: #1e293b;
      padding: 24px 16px;
      border-right: 1px solid #334155;
    }
    .sidebar h2 { color: #38bdf8; font-size: 20px; margin-bottom: 24px; }
    .nav-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 8px;
      text-align: left;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .nav-btn.active, .nav-btn:hover {
      background: #38bdf8;
      color: #0f172a;
    }

    /* Contenido Principal */
    .content {
      flex: 1;
      padding: 32px;
      max-width: 900px;
    }

    h1 { font-size: 26px; margin-bottom: 20px; color: #f8fafc; }

    /* Formulario para agregar bloque */
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 12px;
      align-items: center;
    }
    input {
      background: #334155;
      border: 1px solid #475569;
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    .btn-primary {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-primary:hover { background: #7dd3fc; }

    /* Timeline de Horarios */
    .timeline { display: flex; flex-direction: column; gap: 12px; }
    .bloque-item {
      display: flex;
      align-items: center;
      background: #1e293b;
      border-left: 4px solid #38bdf8;
      padding: 14px 18px;
      border-radius: 8px;
      justify-content: space-between;
    }
    .bloque-hora {
      color: #38bdf8;
      font-weight: bold;
      font-size: 15px;
      width: 140px;
    }
    .bloque-nombre { font-size: 16px; flex: 1; }
    .btn-del {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .btn-del:hover { color: #f87171; }
  </style>
</head>
<body>

  <!-- Barra de Navegación -->
  <div class="sidebar">
    <h2>⚡ Workspace</h2>
    <button class="nav-btn active">📅 Horario Diario</button>
    <button class="nav-btn">📝 Apuntes</button>
    <button class="nav-btn">🤖 Asistente IA</button>
  </div>

  <!-- Contenido -->
  <div class="content">
    <h1>📅 Planificador de Horarios</h1>

    <!-- Formulario -->
    <div class="card">
      <div class="form-grid">
        <input type="text" id="actividad" placeholder="Ej. Estudiar Historia / Python">
        <input type="time" id="horaInicio">
        <input type="time" id="horaFin">
        <button class="btn-primary" onclick="agregarBloque()">Agregar</button>
      </div>
    </div>

    <!-- Lista de Bloques del Día -->
    <h2 style="font-size: 18px; margin-bottom: 14px; color: #94a3b8;">📋 Mi Rutina del Día</h2>
    <div id="listaBloques" class="timeline"></div>
  </div>

  <script>
    // Memoria para los bloques en JavaScript
    let bloques = [];

    function agregarBloque() {
      const actividadInput = document.getElementById("actividad");
      const inicioInput = document.getElementById("horaInicio");
      const finInput = document.getElementById("horaFin");

      const actividad = actividadInput.value.trim();
      const inicio = inicioInput.value;
      const fin = finInput.value;

      if (actividad !== "" && inicio !== "" && fin !== "") {
        bloques.push({ actividad, inicio, fin });

        // Ordenar automáticamente por hora de inicio
        bloques.sort((a, b) => a.inicio.localeCompare(b.inicio));

        // Limpiar campos
        actividadInput.value = "";
        inicioInput.value = "";
        finInput.value = "";

        renderizarBloques();
      } else {
        alert("Por favor completa la actividad y los dos horarios.");
      }
    }

    function borrarBloque(index) {
      bloques.splice(index, 1);
      renderizarBloques();
    }

    function renderizarBloques() {
      const contenedor = document.getElementById("listaBloques");
      contenedor.innerHTML = "";

      if (bloques.length === 0) {
        contenedor.innerHTML = `<p style="color: #64748b; font-style: italic;">No has agregado bloques para hoy.</p>`;
        return;
      }

      bloques.forEach((bloque, index) => {
        const item = document.createElement("div");
        item.className = "bloque-item";
        item.innerHTML = `
          <div class="bloque-hora">⏱️ ${bloque.inicio} - ${bloque.fin}</div>
          <div class="bloque-nombre">${bloque.actividad}</div>
          <button class="btn-del" onclick="borrarBloque(${index})">❌</button>
        `;
        contenedor.appendChild(item);
      });
    }

    // Dibujar lista vacía inicial
    renderizarBloques();
  </script>
</body>
</html>
