<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="google-site-verification" content="bfR2YDTiNsRUiqWkR6BGq-OYtmjJmArtnScVkBveDFo" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santi Workspace - Organiza tu Día e IA</title>
  <style>
    /* Estilos globales */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      min-height: 100vh;
    }

    /* Barra lateral estilo App */
    .sidebar {
      width: 250px;
      background: #1e293b;
      padding: 24px 16px;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar h2 { color: #38bdf8; font-size: 20px; margin-bottom: 20px; }
    .nav-btn {
      width: 100%;
      padding: 12px 16px;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 8px;
      text-align: left;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn:hover, .nav-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    /* Contenedor principal */
    .content {
      flex: 1;
      padding: 32px;
      max-width: 900px;
    }

    /* Manejo de secciones (pestañas) */
    .section { display: none; }
    .section.active { display: block; }

    /* Tarjetas y formularios */
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-top: 16px;
    }
    input, textarea, button {
      background: #334155;
      border: 1px solid #475569;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }
    button.btn-primary {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button.btn-primary:hover { background: #7dd3fc; }
  </style>
</head>
<body>

  <!-- Menu Lateral -->
  <div class="sidebar">
    <h2>⚡ Santi Workspace</h2>
    <button class="nav-btn active" onclick="mostrarSeccion('horario', this)">📅 Horario Diario</button>
    <button class="nav-btn" onclick="mostrarSeccion('apuntes', this)">📝 Bloc de Apuntes</button>
    <button class="nav-btn" onclick="mostrarSeccion('ia', this)">🤖 Asistente IA</button>
  </div>

  <!-- Contenido -->
  <div class="content">

    <!-- SECCIÓN 1: HORARIO -->
    <div id="horario" class="section active">
      <h1>📅 Planificador de Horarios</h1>
      <div class="card">
        <p>Aquí administras tus bloques de tiempo de estudio.</p>
      </div>
    </div>

    <!-- SECCIÓN 2: APUNTES -->
    <div id="apuntes" class="section">
      <h1>📝 Mis Apuntes de Estudio</h1>
      <div class="card">
        <textarea style="width: 100%; height: 150px;" placeholder="Escribe tus notas de clase o ideas aquí..."></textarea>
        <button class="btn-primary" style="margin-top: 10px;">Guardar Nota</button>
      </div>
    </div>

    <!-- SECCIÓN 3: IA -->
    <div id="ia" class="section">
      <h1>🤖 Asistente IA</h1>
      <div class="card">
        <p>Hazle preguntas a la Inteligencia Artificial sobre tus materias.</p>
      </div>
    </div>

  </div>

  <script>
    // JavaScript para cambiar de pestaña sin recargar la página
    function mostrarSeccion(idSeccion, boton) {
      // Ocultar todas las secciones
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      // Quitar clase activa a todos los botones
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      // Mostrar la sección seleccionada y activar el botón
      document.getElementById(idSeccion).classList.add('active');
      boton.classList.add('active');
    }
  </script>
</body>
</html>
