<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="google-site-verification" content="bfR2YDTinsRUiqWkR6BGq-OYtmjJmArtnScVkBveDFo" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santi Workspace - Organiza tu Día e IA</title>
    <!-- Fuente moderna Inter de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0b0f17;
            --bg-card: rgba(22, 30, 46, 0.7);
            --bg-sidebar: #111827;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Barra Lateral Modernizada --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding: 0 8px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: var(--accent-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .brand h2 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .nav-btn {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }

        .nav-btn.active {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.2);
        }

        /* --- Contenido Principal --- */
        .main-content {
            flex: 1;
            padding: 40px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        /* --- Rejilla de Tarjetas Modernas --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Controles Interactivos */
        input[type="text"], textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent-blue);
        }

        .btn-action {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.25);
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .notes-area {
            height: 120px;
            resize: none;
        }
    </style>
</head>
<body>

    <!-- Sidebar Lateral -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">S</div>
            <h2>Santi Workspace</h2>
        </div>
        <button class="nav-btn active">📊 Panel Principal</button>
        <button class="nav-btn">📝 Apuntes Rápidos</button>
        <button class="nav-btn">⏱️ Temporizador Pomodoro</button>
        <button class="nav-btn">🤖 Asistente de IA</button>
    </aside>

    <!-- Área de Trabajo Principal -->
    <main class="main-content">
        <header class="header">
            <h1>Bienvenido a tu Espacio de Estudio</h1>
            <p>Gestiona tus tareas, toma notas e impulsa tu productividad desde un solo lugar.</p>
        </header>

        <section class="grid">
            <!-- Tarjeta 1: Bloc de Notas -->
            <div class="card">
                <h3>📝 Apuntes Rápidos</h3>
                <textarea class="notes-area" id="userNotes" placeholder="Escribe aquí tus ideas o recordatorios del día..."></textarea>
                <button class="btn-action" onclick="saveNotes()">Guardar Apunte</button>
            </div>

            <!-- Tarjeta 2: Tareas Pendientes -->
            <div class="card">
                <h3>✅ Lista de Objetivos</h3>
                <input type="text" id="taskInput" placeholder="Añadir nueva tarea...">
                <button class="btn-action" style="background: rgba(255,255,255,0.08); box-shadow:none; border: 1px solid var(--border-color);" onclick="addTask()">+ Agregar Tarea</button>
                <ul id="taskList" style="margin-top: 16px; list-style: none; display: flex; flex-direction: column; gap: 8px;"></ul>
            </div>
        </section>
    </main>

    <script>
        // Cargar notas guardadas previamente
        document.getElementById('userNotes').value = localStorage.getItem('santi_notes') || '';

        function saveNotes() {
            const notes = document.getElementById('userNotes').value;
            localStorage.setItem('santi_notes', notes);
            alert('¡Apunte guardado correctamente en tu navegador!');
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value.trim()) return;
            
            const ul = document.getElementById('taskList');
            const li = document.createElement('li');
            li.style.cssText = "padding: 10px; background: rgba(0,0,0,0.2); border-radius: 6px; font-size: 14px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;";
            li.innerHTML = `<span>${input.value}</span> <button onclick="this.parentElement.remove()" style="background:none; border:none; color:#ef4444; cursor:pointer;">✕</button>`;
            
            ul.appendChild(li);
            input.value = '';
        }
    </script>
</body>
</html>
