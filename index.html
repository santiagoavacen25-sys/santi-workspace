<!DOCTYPE html>
<html lang="es" data-theme="purple">
<head>
    <meta name="google-site-verification" content="bfR2YDTinsRUiqWkR6BGq-OYtmjJmArtnScVkBveDFo" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santi Workspace - Organiza tu Día e IA</title>
    
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- Definición de Temas de Color --- */
        [data-theme="purple"] {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
        }
        [data-theme="blue"] {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
        }
        [data-theme="emerald"] {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --gradient: linear-gradient(135deg, #34d399 0%, #059669 100%);
        }
        [data-theme="sunset"] {
            --primary: #f97316;
            --primary-glow: rgba(249, 115, 22, 0.4);
            --gradient: linear-gradient(135deg, #fb923c 0%, #db2777 100%);
        }

        :root {
            --bg-dark: #080b11;
            --bg-sidebar: #0f1523;
            --card-bg: rgba(18, 26, 43, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --radius-lg: 18px;
            --radius-md: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Barra Lateral --- */
        .sidebar {
            width: 270px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            background: var(--gradient);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            box-shadow: 0 0 20px var(--primary-glow);
            animation: pulse 3s infinite ease-in-out;
        }

        .brand h2 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            list-style: none;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transform: translateX(4px);
        }

        .nav-btn.active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        /* Cambiador de Color */
        .theme-picker {
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
        }

        .theme-picker span {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .color-dots {
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .dot:hover { transform: scale(1.2); }
        .dot.purple { background: #8b5cf6; }
        .dot.blue { background: #3b82f6; }
        .dot.emerald { background: #10b981; }
        .dot.sunset { background: #f97316; }

        /* --- Área Principal --- */
        .main-content {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease-out;
        }

        .header {
            margin-bottom: 36px;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Rejilla de Tarjetas Interactivas --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px var(--primary-glow);
        }

        .card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: white;
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        textarea:focus, input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn-glow {
            width: 100%;
            padding: 14px;
            margin-top: 14px;
            background: var(--gradient);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-glow:hover {
            opacity: 0.9;
            transform: scale(0.99);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div>
            <div class="brand">
                <div class="brand-logo">S</div>
                <h2>Santi Workspace</h2>
            </div>
            
            <ul class="menu-list">
                <li><button class="nav-btn active">⚡ Panel Principal</button></li>
                <li><button class="nav-btn">📝 Apuntes Inteligentes</button></li>
                <li><button class="nav-btn">⏱️ Reloj Pomodoro</button></li>
                <li><button class="nav-btn">🤖 Asistente de IA</button></li>
            </ul>
        </div>

        <!-- Selector de Color Personalizable -->
        <div class="theme-picker">
            <span>Color de Entorno</span>
            <div class="color-dots">
                <div class="dot purple" onclick="setTheme('purple')"></div>
                <div class="dot blue" onclick="setTheme('blue')"></div>
